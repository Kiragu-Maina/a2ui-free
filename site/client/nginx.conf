# nginx serving the static Lit shell bundle inside the client container.
# Host nginx fronts this with TLS and proxies /agent/ to the A2A server.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html so client-side routing
    # works. Assets with a content hash get aggressive caching; index.html and
    # other html files revalidate quickly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400";
    }

    # Health probe target for compose healthchecks.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
