# a2ui-free.alkenacode.dev
# Lit shell (static) at / + Python A2A agent (proxy) at /agent/.
# certbot installs the matching server-block for :443 + TLS automatically.

server {
    server_name a2ui-free.alkenacode.dev;

    access_log /var/log/nginx/a2ui-free.alkenacode.dev.access.log;
    error_log /var/log/nginx/a2ui-free.alkenacode.dev.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # A2A agent: strip /agent prefix before forwarding to the python server,
    # which lives at /. The agent card on the python side advertises
    # https://a2ui-free.alkenacode.dev/agent so the A2A SDK in the browser
    # routes subsequent calls back through this same prefix.
    location /agent/ {
        proxy_pass http://127.0.0.1:4905/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        # Free-tier council with synthesize-best can run 60 to 120s on a
        # cold pass (N parallel children + judge). 300s leaves margin.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Lit shell client.
    location / {
        proxy_pass http://127.0.0.1:4904;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 30s;
    }

    listen 80;
    listen [::]:80;
}
